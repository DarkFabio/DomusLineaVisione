ui:
  camera_heigh : 600

camera:
  min_confidence: 0.50
  min_area_percentage: 0.25 # 0.0 - 1.0 percentuale, alzando il valore permette pezzi più piccoli ok
  max_area_percentage: 1.0  # 0.0 - 1.0 percentuale, alzando il valore permette pezzi più grandi ok
  min_rect_ratio: 0.85 # 0.0-1.0 più è alto più deve essere un rettangolo
  count_area_top: 550 # posizione in pixel di inizio area di conteggio
  count_area_bottom: 680 # posizione in pixel di fine area di conteggio
  count_lock_time: 1.0 # [s] da quando conto una fila aspetto a contarne un'altra (elimina oscillazioni all'ingresso)

